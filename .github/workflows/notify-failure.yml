# Fleet failure notifier. Identical shape to every other repo's copy -- see
# docs/interactions/local-mcp-containers.md and docs's own notify-failure.yml
# for the reasoning behind each condition below.
name: Notify on failure

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.name != 'Notify on failure'
    uses: tnoff/github-workflows/.github/workflows/discord-notify.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # discord-notify-v1.0.0
    with:
      source_run_url: ${{ github.event.workflow_run.html_url }}
      source_workflow: ${{ github.event.workflow_run.name }}
      source_branch: ${{ github.event.workflow_run.head_branch }}
      source_actor: ${{ github.event.workflow_run.actor.login }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      message: >-
        Triggered by ${{ github.event.workflow_run.event }}. Nobody is watching
        a checks list for this one, which is why it is here.
    secrets:
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
