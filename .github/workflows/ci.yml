name: CI

# Pull-request checks. No app code here, so this is deliberately thin: does
# .pre-commit-config.yaml pass, is there a secret in the diff, and does every
# uses: in this repo's own workflows still match its pinned callee's
# inputs/secrets. Ported from the docs/terraform house pattern -- see
# docs/interactions/local-mcp-containers.md and docs/AGENTS.md.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    uses: tnoff/github-workflows/.github/workflows/pre-commit.yml@f6569d2b6f242fb91759fe0ebfa990a99c09585b

  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@f6569d2b6f242fb91759fe0ebfa990a99c09585b

  # Catches a `uses:` whose inputs or secrets no longer match the pinned
  # callee -- that mismatch fails the calling workflow at STARTUP with no
  # check reported and no workflow_run event, so neither this list nor
  # notify-failure.yml would otherwise see it.
  contracts:
    name: Workflow contracts
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@f6569d2b6f242fb91759fe0ebfa990a99c09585b

  result:
    name: CI result
    # The stable name for the branch ruleset to require (see
    # docs/projects/mcp-local-registry.md and infra/repos.tf's mcp-local
    # module). None of the three jobs above are conditional, unlike
    # backstage's equivalent, so this needs no metadata/changes gating --
    # it just needs all three and fails if any of them did.
    if: always()
    needs: [pre-commit, secrets, contracts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "secrets:    ${{ needs.secrets.result }}"
          echo "contracts:  ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        if: >-
          needs.pre-commit.result == 'failure' || needs.pre-commit.result == 'cancelled' ||
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
