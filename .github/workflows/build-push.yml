name: Build and push

# One job per image, on every push to main -- including a Renovate merge, so
# a landed bump actually rebuilds instead of waiting for someone to notice
# and run `docker build` by hand. See docs/projects/mcp-local-registry.md.
#
# single_tag: true and no per-commit secondary tag, deliberately -- unlike
# every other buildkit-docker-push.yml consumer in the fleet, nothing here
# is a deployed workload that might need to pin or roll back to a specific
# past build. These are laptop dev tools rebuilt from whatever's on main;
# an unbounded per-merge tag would be pure accumulation with no consumer.
#
# platform: linux/amd64 and an ubuntu-24.04 (not -arm) runner, both
# deliberate overrides of the reusable workflow's fleet-wide defaults --
# those default to arm64 because OKE's nodes are Ampere A1. These images run
# on the operator's laptop instead, which is x86_64.

on:
  push:
    branches: [main]

concurrency:
  group: build-push-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kubernetes-mcp-oci:
    name: kubernetes-mcp-oci
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@bad6dacd6d4d75b465314b1ec984efd86cc8f5e6
    with:
      context: kubernetes-mcp-oci
      dockerfile: kubernetes-mcp-oci/Dockerfile
      platform: linux/amd64
      runner_labels: '["ubuntu-24.04"]'
      single_tag: true
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_KUBERNETES }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  backstage-mcp-server:
    name: backstage-mcp-server
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@bad6dacd6d4d75b465314b1ec984efd86cc8f5e6
    with:
      context: backstage-mcp-server
      dockerfile: backstage-mcp-server/Dockerfile
      platform: linux/amd64
      runner_labels: '["ubuntu-24.04"]'
      single_tag: true
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_BACKSTAGE }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  oci-mcp:
    name: oci-mcp
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@bad6dacd6d4d75b465314b1ec984efd86cc8f5e6
    with:
      context: oci-mcp
      dockerfile: oci-mcp/Dockerfile
      platform: linux/amd64
      runner_labels: '["ubuntu-24.04"]'
      single_tag: true
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_OCI }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}
