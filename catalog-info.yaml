# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
#
# github.com/project-slug is DERIVED by the portal's
# AnnotateScmSlugEntityProcessor from the location this file was fetched from.
# No techdocs-ref: there's no mkdocs.yml/docs/ tree here, just a README, and
# the annotation would assert a target that doesn't exist. Same reasoning as
# every other repo here without one; add it if that ever changes.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mcp-local
  description: >-
    Registry of the MCP servers Claude Code runs locally on the laptop: Dockerfiles
    for the ones with no upstream image, pinned image refs for the ones that pull
    as-is, and the scripts that build/pull and register all of them with Claude
    Code. Runs on the workstation only -- nothing here is deployed to the cluster.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/github-workflows
